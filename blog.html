  <link rel="stylesheet" href="style/site.css">
  <style>
    :root {
      --bg-primary: #f9f7f2;
      --bg-secondary: #ffffff;
      --text-primary: #1b1b1b;
      --text-muted: #666666;
      --accent: #d97757;
      --border-color: #e5e1da;
      
      --font-heading: "Ivar", Georgia, "Times New Roman", serif;
      --font-body: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      font-family: var(--font-body);
      line-height: 1.6;
      color: var(--text-primary);
      background-color: var(--bg-primary);
      margin: 0;
      -webkit-font-smoothing: antialiased;
    }

    #welcome {
      background-color: var(--bg-primary);
      color: var(--text-primary);
      padding: 60px 0 40px 0;
      font-family: var(--font-heading);
      font-size: 2.5rem;
      font-weight: 700;
      text-align: center;
      letter-spacing: -0.02em;
    }

    #nav {
      background-color: rgba(249, 247, 242, 0.9);
      padding: 24px 0;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 1000;
      border-bottom: 1px solid var(--border-color);
      backdrop-filter: blur(10px);
    }

    #nav a {
      color: var(--text-primary);
      text-decoration: none;
      margin: 0 24px;
      font-weight: 500;
      font-size: 1rem;
      transition: color 0.3s ease;
    }

    #nav a:hover {
      color: var(--accent);
    }

    #main {
      max-width: 800px;
      margin: 60px auto;
      padding: 0 24px;
    }

    .BlogEntry {
      margin-bottom: 48px;
      padding-bottom: 48px;
      border-bottom: 1px solid var(--border-color);
    }

    .BlogEntry:last-child {
      border-bottom: none;
    }

    #EntryTitle {
      font-family: var(--font-heading);
      font-size: 1.8rem;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 12px;
    }

    #EntryTitle a {
      color: var(--text-primary);
      text-decoration: none;
      transition: color 0.2s;
    }

    #EntryTitle a:hover {
      color: var(--accent);
    }

    #EntryDate {
      font-size: 0.9rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.05em;
      font-weight: 500;
    }

    p small {
      display: block;
      text-align: center;
      margin-top: 80px;
      color: var(--text-muted);
    }

    p small a {
      color: var(--text-muted);
    }
  </style>
</head>
